<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Point – instellingen</title>
    <meta name="manifest.open_in_tab" content="true">
    <script type="module" crossorigin src="/chunks/options-6jEvcIwL.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/options-DZn_6Xi_.css">
  </head>
  <body>
    <!-- Texts come from @the-point/core/i18n: data-i18n="<key in settings>" sets the text. -->
    <main>
      <header>
        <h1>The Point</h1>
        <p class="sub">
          <span data-i18n="autoSaved"></span>
          <span id="saved" class="saved" aria-live="polite"></span>
        </p>
      </header>

      <section>
        <h2 data-i18n="languageHeading"></h2>
        <label class="field inline">
          <span data-i18n="interfaceLanguage"></span>
          <select id="interfaceTaal"></select>
        </label>
        <label class="field inline">
          <span data-i18n="summaryLanguage"></span>
          <select id="taal"></select>
        </label>
      </section>

      <section>
        <h2 data-i18n="aiService"></h2>
        <div class="radio-row" role="radiogroup" data-i18n-aria="aiService">
          <label class="choice"><input type="radio" name="provider" value="claude">
            <span><b>Claude</b> (Anthropic)</span></label>
          <label class="choice"><input type="radio" name="provider" value="gemini">
            <span><b>Gemini</b> (Google)</span></label>
        </div>
        <p class="hint" data-i18n="providerHint"></p>
      </section>

      <section data-provider="claude">
        <h2>Claude</h2>
        <label class="field">
          <span data-i18n="apiKey"></span>
          <span class="key-row">
            <input id="key-claude" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…">
            <button type="button" class="ghost" data-toggle="key-claude" data-i18n="show"></button>
          </span>
          <small><span data-i18n="keyHintBrowser.0"></span><a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noreferrer">console.anthropic.com</a><span data-i18n="keyHintBrowser.1"></span></small>
        </label>
        <label class="field">
          <span data-i18n="model"></span>
          <input id="model-claude" list="models-claude" spellcheck="false">
          <datalist id="models-claude"></datalist>
        </label>
        <div class="test-row">
          <button type="button" data-test="claude" data-i18n="testConnection"></button>
          <span class="test-result" id="test-claude" aria-live="polite"></span>
        </div>
      </section>

      <section data-provider="gemini">
        <h2>Gemini</h2>
        <label class="field">
          <span data-i18n="apiKey"></span>
          <span class="key-row">
            <input id="key-gemini" type="password" autocomplete="off" spellcheck="false" placeholder="AIza…">
            <button type="button" class="ghost" data-toggle="key-gemini" data-i18n="show"></button>
          </span>
          <small><span data-i18n="keyHintBrowser.0"></span><a href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer">aistudio.google.com</a><span data-i18n="keyHintBrowser.1"></span></small>
        </label>
        <label class="field">
          <span data-i18n="model"></span>
          <input id="model-gemini" list="models-gemini" spellcheck="false">
          <datalist id="models-gemini"></datalist>
        </label>
        <div class="test-row">
          <button type="button" data-test="gemini" data-i18n="testConnection"></button>
          <span class="test-result" id="test-gemini" aria-live="polite"></span>
        </div>
      </section>

      <section>
        <h2 data-i18n="summaryHeading"></h2>
        <label class="check"><input type="checkbox" id="automatisch">
          <span><span data-i18n="auto"></span><small data-i18n="autoHint"></small></span></label>
        <label class="check"><input type="checkbox" id="autoplayPauzeren">
          <span><span data-i18n="pause"></span><small data-i18n="pauseHint"></small></span></label>
        <label class="check"><input type="checkbox" id="markeringen">
          <span data-i18n="markers"></span></label>
      </section>

      <section>
        <h2 data-i18n="readAloudHeading"></h2>
        <p data-i18n="readAloudIntro"></p>
        <label class="field">
          <span data-i18n="voice"></span>
          <select id="stem"></select>
          <small id="stem-hint"></small>
        </label>
        <label class="field inline">
          <span data-i18n="speed"></span>
          <span class="unit">
            <input id="spreeksnelheid" type="range" min="0.75" max="1.5" step="0.05">
            <output id="spreeksnelheid-waarde"></output>
          </span>
        </label>
        <div class="test-row">
          <button type="button" id="test-stem" data-i18n="testVoice"></button>
        </div>
      </section>

      <section>
        <h2 data-i18n="noTranscriptHeading"></h2>
        <label class="check"><input type="checkbox" id="geminiTerugval">
          <span><span data-i18n="fallback"></span><small data-i18n="fallbackHint"></small></span></label>
        <label class="field inline">
          <span data-i18n="confirmLonger"></span>
          <span class="unit"><input id="bevestigVanafMinuten" type="number" min="1" max="600" step="1">
            <span data-i18n="minutes"></span></span>
        </label>
      </section>

      <section>
        <h2 data-i18n="cacheHeading"></h2>
        <p data-i18n="cacheText"></p>
        <div class="test-row">
          <span id="cache-count">…</span>
          <button type="button" id="clear-cache" data-i18n="clearCache"></button>
        </div>
      </section>

      <section>
        <h2 data-i18n="debugHeading"></h2>
        <label class="check"><input type="checkbox" id="debugLog">
          <span data-i18n="debugCheck"></span></label>
        <div class="test-row">
          <button type="button" id="show-log" data-i18n="showLog"></button>
          <button type="button" id="clear-log" class="ghost" data-i18n="clearLog"></button>
        </div>
        <div id="log" class="log" hidden></div>
      </section>
    </main>
  </body>
</html>
